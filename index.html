<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Experiential Immanence</title>
<style>
  html, body { margin: 0; background: #fff; color: #000; }
  body { font: 17px/1.5 "Times New Roman", Times, serif; }
  main { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem 1rem; box-sizing: border-box; }
  .frame { position: relative; height: min(88vh, calc((100vw - 2rem) * 16 / 9)); height: min(88svh, calc((100vw - 2rem) * 16 / 9)); aspect-ratio: 9 / 16; background: #ddd; overflow: hidden; }
  .frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .btn { position: absolute; bottom: 12px; width: 40px; height: 40px; border: 1px solid #fff5; border-radius: 50%; background: #211d1999;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); color: #fff; display: grid; place-items: center; cursor: pointer; padding: 0; }
  .btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .btn:focus-visible { outline: 2px solid #000; outline-offset: 3px; }
  #play { right: 12px; } #sound { right: 60px; }
  #play[data-playing="true"] .i-play, #play[data-playing="false"] .i-pause,
  #sound[data-muted="true"] .i-on, #sound[data-muted="false"] .i-off { display: none; }
  .excerpt { max-width: 34rem; margin: 3rem auto 0; }
  .excerpt:empty { display: none; }
</style>
</head>
<body>
<main>
  <div class="frame">
    <video id="v" muted loop playsinline preload="metadata" poster="pov-ride-poster.jpg" aria-label="A ride on a scooter, seen from the passenger seat">
      <source src="pov-ride-compressed.mp4" type="video/mp4">
    </video>
    <button class="btn" id="sound" type="button" aria-label="Turn sound on" data-muted="true">
      <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9Z"/><path d="m16 9 5 6M21 9l-5 6"/></svg>
      <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9Z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    </button>
    <button class="btn" id="play" type="button" aria-label="Play" data-playing="false">
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 10 7-10 7Z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
    </button>
  </div>
  <section class="excerpt"><!-- your excerpt goes here --></section>
</main>
<script>
(function () {
  var v = document.getElementById("v"), play = document.getElementById("play"), sound = document.getElementById("sound");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)"), userPaused = false;
  function sync() {
    play.dataset.playing = String(!v.paused);
    play.setAttribute("aria-label", v.paused ? "Play" : "Pause");
    sound.dataset.muted = String(v.muted);
    sound.setAttribute("aria-label", v.muted ? "Turn sound on" : "Turn sound off");
  }
  function start() { var p = v.play(); if (p && p.catch) p.catch(function () { v.muted = true; v.play().catch(function () {}); }); }
  play.addEventListener("click", function () { if (v.paused) { userPaused = false; start(); } else { userPaused = true; v.pause(); } });
  sound.addEventListener("click", function () { v.muted = !v.muted; if (!v.muted) { v.volume = 1; userPaused = false; start(); } sync(); });
  ["play", "pause", "volumechange"].forEach(function (e) { v.addEventListener(e, sync); });
  // starts silently when it comes into view, as browsers allow; sound waits for the speaker button
  if ("IntersectionObserver" in window && !reduce.matches) {
    new IntersectionObserver(function (en) {
      if (en[0].isIntersecting) { if (!userPaused) start(); } else v.pause();
    }, { threshold: 0.4 }).observe(v);
  }
  sync();
})();
</script>
</body>
</html>
