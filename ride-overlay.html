<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Experiential Immanence — ride</title><link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet"><style>@font-face{font-family:Caveat;font-style:normal;font-weight:400 600;font-display:swap;src:url("assets/ride-handwriting.woff2") format("woff2")}body{margin:0;padding:1rem;background:#fff;color:#2a2724;font-family:"EB Garamond",Georgia,serif;--muted:#666}
.ride-overlay{width:min(100%,440px);margin:4rem auto 3rem}
.ride-frame{position:relative;width:100%;aspect-ratio:9/16;background:#d9d3c7;overflow:hidden}
.ride-frame video,.ride-frame canvas{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.ride-frame canvas{pointer-events:none}
.ride-toggle{position:absolute;right:12px;bottom:12px;width:40px;height:40px;border:1px solid #fff6;border-radius:50%;background:#211d19b8;color:#fff8ea;display:grid;place-items:center;padding:9px;cursor:pointer;z-index:2;touch-action:manipulation}
.ride-toggle:hover{background:#211d19e8}.ride-toggle:focus-visible{outline:2px solid white;outline-offset:3px}
.ride-toggle svg{grid-area:1/1;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ride-toggle .ride-play-icon{fill:currentColor;stroke-width:1.3}
.ride-toggle[data-playing=true] .ride-play-icon,.ride-toggle[data-playing=false] .ride-pause-icon{display:none}

@media(max-width:600px){.ride-overlay{margin:3rem auto}}
</style></head><body><figure class="ride-overlay" aria-label="A recorded viewpoint where seeing, sound, bodily feeling, thought, memory and an I-thought appear and fade in one scene">
  <div class="ride-frame">
    <video id="ride-video" muted loop playsinline preload="metadata" poster="pov-ride-poster.jpg" aria-label="Recorded passenger viewpoint from behind a scooter rider"><source src="pov-ride-compressed.mp4" type="video/mp4"></video>
    <canvas id="ride-canvas" aria-hidden="true"></canvas>
    <button id="ride-toggle" class="ride-toggle" type="button" aria-label="Play video and animation" aria-controls="ride-video" data-playing="false">
      <svg class="ride-pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
      <svg class="ride-play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 10 7-10 7Z"/></svg>
    </button>
  </div>

</figure><script>
(function () {
  "use strict";

  var video = document.getElementById("ride-video");
  var canvas = document.getElementById("ride-canvas");
  var toggle = document.getElementById("ride-toggle");
  var ctx = canvas.getContext("2d");
  var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  var W = 540, H = 960;
  var ink = "#fff8ea", shadow = "rgba(26,22,18,.62)";
  var colors = {
    sight: "#d6efb2", sound: "#9fe3ee", touch: "#ffcfb8",
    body: "#d8c8ff", thought: "#f7b6df", memory: "#ffdaa0",
    expectation: "#fff1c9", feeling: "#cbd8f1"
  };
  var time = reducedMotion.matches ? 11 : 0;
  var playing = false, manualPaused = false, visible = false;
  var frame = 0, requestId = 0, scale = 1, ratio = 1;

  function clamp(n) { return Math.max(0, Math.min(1, n)); }
  function ease(n) { n = clamp(n); return n * n * (3 - 2 * n); }
  function jitter(seed, offset) { return Math.sin(seed * 38.31 + offset * 91.7) * 1.4; }

  function stroke(points, color, width, reveal, dashed, seed) {
    if (reveal <= 0) return;
    var length = 0, lengths = [];
    for (var i = 1; i < points.length; i++) {
      var d = Math.hypot(points[i][0] - points[i - 1][0], points[i][1] - points[i - 1][1]);
      lengths.push(d); length += d;
    }
    var remaining = length * reveal;
    ctx.save(); ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.setLineDash(dashed ? [7, 8] : []);
    for (var k = 1; k < points.length && remaining > 0; k++) {
      var part = Math.min(1, remaining / lengths[k - 1]);
      remaining -= lengths[k - 1];
      var a = points[k - 1], b = points[k];
      var x = a[0] + (b[0] - a[0]) * part;
      var y = a[1] + (b[1] - a[1]) * part;
      for (var pass = 0; pass < 2; pass++) {
        ctx.beginPath();
        ctx.moveTo(a[0] + jitter(seed + k, 1), a[1] + jitter(seed + k, 2));
        ctx.quadraticCurveTo((a[0] + x) / 2 + jitter(seed + k, 3), (a[1] + y) / 2 + jitter(seed + k, 4), x + jitter(seed + k, 5), y + jitter(seed + k, 6));
        ctx.strokeStyle = pass ? color : shadow;
        ctx.lineWidth = pass ? width : width + 3;
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function curve(points, color, reveal, dashed, seed) {
    var smooth = [];
    for (var i = 0; i < points.length - 1; i++) {
      var a = points[Math.max(0, i - 1)], b = points[i];
      var c = points[i + 1], d = points[Math.min(points.length - 1, i + 2)];
      for (var t = 0; t < 1; t += .1) {
        var t2 = t * t, t3 = t2 * t;
        smooth.push([
          .5 * (2*b[0] + (-a[0]+c[0])*t + (2*a[0]-5*b[0]+4*c[0]-d[0])*t2 + (-a[0]+3*b[0]-3*c[0]+d[0])*t3),
          .5 * (2*b[1] + (-a[1]+c[1])*t + (2*a[1]-5*b[1]+4*c[1]-d[1])*t2 + (-a[1]+3*b[1]-3*c[1]+d[1])*t3)
        ]);
      }
    }
    smooth.push(points[points.length - 1]);
    stroke(smooth, color, 2.5, reveal, dashed, seed);
  }

  function note(text, x, y, options, reveal) {
    if (reveal <= 0) return;
    var size = options.size || 27;
    ctx.save();
    ctx.font = size + "px Caveat, 'Comic Sans MS', cursive";
    var width = ctx.measureText(text).width;
    if (width > W - 54) {
      size *= (W - 54) / width;
      ctx.font = size + "px Caveat, 'Comic Sans MS', cursive";
      width = ctx.measureText(text).width;
    }
    var left = options.align === "right" ? x - width : options.align === "center" ? x - width / 2 : x;
    left = Math.max(14, Math.min(W - width - 14, left));
    y = Math.max(size + 10, Math.min(H - size - 10, y));
    ctx.translate(left, y);
    ctx.rotate(jitter(options.seed || x + y, 8) * .006);
    ctx.beginPath(); ctx.rect(-6, -size, (width + 12) * reveal, size * 2); ctx.clip();
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "rgba(255,248,234,.88)";
    ctx.lineWidth = 5;
    ctx.strokeText(text, 0, 0);
    ctx.fillStyle = "#25221d";
    ctx.fillText(text, 0, 0);
    ctx.restore();
  }

  function mark(start, end, text, x, y, color, options, drawing) {
    if (time <= start || time >= end) return;
    var appear = ease((time - start) / .8);
    var fade = ease((end - time) / 1.3);
    ctx.save(); ctx.globalAlpha *= fade;
    if (drawing) drawing(appear);
    note(text, x, y, options || {}, appear);
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(ratio * scale, 0, 0, ratio * scale, 0, 0);

    mark(4.2, 21.3, "the road ahead", 300, 470, colors.sight, { seed: 11 }, function (p) {
      curve([[250, 330], [300, 400], [360, 520]], colors.sight, p, false, 11);
    });
    mark(1.6, 9.2, "light in the sky", 265, 130, colors.sight, { align: "center", seed: 12 });
    mark(2.7, 19.8, "sound", 30, 610, colors.sound, { seed: 13 }, function (p) {
      for (var i = 0; i < 3; i++) {
        var arc = [];
        for (var j = 0; j <= 12; j++) {
          var a = -Math.PI * .82 + j / 12 * Math.PI * .65;
          arc.push([205 + Math.cos(a) * (22 + i * 17), 650 + Math.sin(a) * (22 + i * 17)]);
        }
        stroke(arc, colors.sound, 2.2, p, false, 20 + i);
      }
    });
    mark(5.1, 13.7, "wind on my skin", 30, 770, colors.touch, { seed: 15 });
    mark(6.0, 17.6, "a slight lean", 270, 872, colors.body, { align: "center", seed: 16 }, function (p) {
      curve([[40, 930], [140, 905], [270, 900], [400, 905], [500, 930]], colors.body, p, false, 33);
    });
    mark(7.9, 12.3, "“How far now?”", 390, 160, colors.thought, { align: "center", seed: 17 });
    mark(9.8, 15.6, "“Another bend soon”", 270, 222, colors.expectation, { align: "center", seed: 18 }, function (p) {
      curve([[215, 292], [250, 262], [300, 250], [340, 262]], colors.expectation, p, false, 34);
    });
    mark(11.6, 15.1, "“I’m on my way”", 270, 575, colors.thought, { align: "center", seed: 21 });
    mark(13.2, 18.2, "the sunset comes back to mind", 35, 350, colors.memory, { seed: 19 }, function (p) {
      var arc = [];
      for (var i = 0; i <= 16; i++) {
        var a = Math.PI + i / 16 * Math.PI;
        arc.push([120 + Math.cos(a) * 36, 300 + Math.sin(a) * 36]);
      }
      stroke(arc, colors.memory, 2.3, p, false, 35);
    });
    mark(16.3, 21.9, "a passing calm", 270, 195, colors.feeling, { align: "center", seed: 20 });
  }

  function resize() {
    var rect = canvas.getBoundingClientRect();
    ratio = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * ratio);
    canvas.height = Math.round(rect.height * ratio);
    scale = rect.width / W;
    draw();
  }

  function updateControl() {
    toggle.dataset.playing = String(playing);
    toggle.setAttribute("aria-label", playing ? "Pause video and animation" : "Play video and animation");
  }
  function pause(reset) {
    requestId++;
    playing = false;
    video.pause();
    cancelAnimationFrame(frame);
    frame = 0;
    if (reset === true) {
      video.currentTime = 0;
      time = 0;
      draw();
    }
    updateControl();
  }
  async function play() {
    if (playing || document.hidden) return;
    var token = ++requestId;
    try {
      if (video.ended) { video.currentTime = 0; time = 0; }
      await video.play();
      if (token !== requestId) return;
      playing = true; updateControl();
      frame = requestAnimationFrame(loop);
    } catch (_) {
      if (token === requestId) { playing = false; updateControl(); draw(); }
    }
  }
  function loop() {
    if (!playing) return;
    if (!video.paused && !video.seeking && video.readyState >= 2) {
      time = video.currentTime;
      draw();
    }
    frame = requestAnimationFrame(loop);
  }

  toggle.addEventListener("click", function () {
    if (playing) { manualPaused = true; pause(); }
    else {
      manualPaused = false;
      if (reducedMotion.matches) { video.currentTime = 0; time = 0; draw(); }
      play();
    }
  });
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (entries) {
      visible = entries[0].isIntersecting;
      if (!visible) pause(true);
      else if (!manualPaused && !reducedMotion.matches && !document.hidden) play();
    }, { threshold: .25 }).observe(canvas);
  }
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) pause(true);
    else if (visible && !manualPaused && !reducedMotion.matches) play();
  });
  window.addEventListener("pagehide", function () { pause(true); });
  reducedMotion.addEventListener("change", function () {
    if (reducedMotion.matches) { pause(); time = 11; draw(); }
    else if (visible && !manualPaused && !document.hidden) play();
  });
  window.addEventListener("resize", resize);
  if (document.fonts) document.fonts.load("400 27px Caveat").then(resize);
  updateControl(); resize();
})();
</script></body></html>
